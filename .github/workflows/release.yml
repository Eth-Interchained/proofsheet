name: Release

# One tag, three registries, version-aligned.
#
# Ordering matters and is deliberate:
#   guard -> builds -> crates.io -> npm + PyPI -> GitHub release
#
# crates.io goes first because proofsheet (the CLI) depends on
# proofsheet-core by version; the core must be resolvable from the registry
# before the CLI can be published. npm and PyPI have no such coupling and run
# in parallel afterwards.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build everything, publish nothing"
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Nothing is built until the tag and the manifests agree. A tag that says
  # v0.2.0 against manifests saying 0.1.0 publishes artifacts whose reported
  # version is a lie, and registries are immutable.
  guard:
    name: tag and manifests agree
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v5
      - run: python3 scripts/check_versions.py
      - id: v
        run: |
          set -euo pipefail
          MANIFEST=$(python3 -c "
          import json;print(json.load(open('crates/proofsheet-node/package.json'))['version'])")
          echo "manifest version: $MANIFEST"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME#v}"
            echo "tag version: $TAG"
            if [ "$TAG" != "$MANIFEST" ]; then
              echo "MISMATCH: tag v$TAG vs manifests $MANIFEST"
              echo "Bump with: python3 scripts/check_versions.py $TAG"
              exit 1
            fi
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=${{ github.event.inputs.dry_run == 'false' }}" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$MANIFEST" >> "$GITHUB_OUTPUT"

  build-node:
    name: node ${{ matrix.target }}
    needs: guard
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            # Build inside napi-rs's Debian image. A bare ubuntu-latest
            # runner is glibc 2.39, and an addon linked against it refuses to
            # load on Ubuntu 22.04 (2.35), Debian 12 (2.36) or Amazon Linux
            # 2023 (2.34) -- it installs fine and then throws
            # ERR_DLOPEN_FAILED at require() time. The Python wheels avoided
            # this only because maturin-action defaults to manylinux.
            container: ghcr.io/napi-rs/napi-rs/nodejs-rust:lts-debian
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    container: ${{ matrix.container }}
    defaults:
      run:
        # Inside a container GitHub falls back to `sh`, where
        # `set -o pipefail` fails with "Illegal option". Every run step in
        # this job assumes bash, so say so once here rather than per step.
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        if: matrix.container == ''
        with:
          node-version: 20
      - uses: Swatinem/rust-cache@v2
      - name: Build addon
        working-directory: crates/proofsheet-node
        run: |
          npm install --no-audit --no-fund
          npx napi build --platform --release --target ${{ matrix.target }}

      # An addon that needs a newer glibc than the user has installs cleanly
      # and then fails at require(). Catch it at build time instead.
      - name: Linux addon must not require a modern glibc
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        working-directory: crates/proofsheet-node
        run: |
          set -euo pipefail
          NODE_FILE=$(ls *.node)
          echo "checking $NODE_FILE"
          MAXV=$(objdump -T "$NODE_FILE" | grep -o 'GLIBC_[0-9.]*' \
                 | sed 's/GLIBC_//' | sort -V | tail -1)
          echo "highest glibc symbol required: $MAXV"
          # 2.28 = Debian 10 / RHEL 8. Anything above 2.31 excludes distros
          # that are still widely deployed.
          python3 - "$MAXV" <<'PY'
          import sys
          got = tuple(int(x) for x in sys.argv[1].split('.'))
          ceiling = (2, 31)
          if got > ceiling:
              print(f"FAIL: addon requires glibc {sys.argv[1]}, ceiling is "
                    f"{'.'.join(map(str, ceiling))}. It will not load on "
                    "Ubuntu 22.04, Debian 12 or Amazon Linux 2023.")
              sys.exit(1)
          print("ok: within the glibc ceiling")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: node-${{ matrix.target }}
          path: crates/proofsheet-node/*.node
          if-no-files-found: error

  build-python:
    name: wheel ${{ matrix.target }}
    needs: guard
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
          - os: macos-latest
            target: x86_64
          - os: macos-latest
            target: aarch64
          - os: windows-latest
            target: x64
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          # abi3 means one wheel per platform covers Python 3.8+, so the
          # matrix is platforms only, not platforms x interpreters.
          args: --release --out dist --manifest-path crates/proofsheet-py/Cargo.toml
          sccache: "true"
          manylinux: auto
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}
          path: dist
          if-no-files-found: error

  build-sdist:
    name: python sdist
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist --manifest-path crates/proofsheet-py/Cargo.toml
      # The sdist is SOURCE, so it has a packaging boundary the wheels do
      # not -- and it broke exactly the way the crates.io tarball did:
      # include_str! reaching outside the crate directory compiles from a
      # git checkout and then fails for anyone who builds from the sdist.
      #
      # pip prefers a wheel, so this only bites platforms without one
      # (linux-aarch64, musl, FreeBSD) -- which is precisely why it went
      # unnoticed. Build from the sdist and import it.
      - name: The sdist must build and import
        run: |
          set -euo pipefail
          SDIST=$(ls dist/*.tar.gz)
          echo "building from $SDIST"
          python3 -m venv /tmp/sdistenv
          /tmp/sdistenv/bin/pip install --upgrade pip >/dev/null
          # --no-binary forces a real compile from source rather than
          # silently satisfying the install from a wheel.
          /tmp/sdistenv/bin/pip install --no-binary :all: "$SDIST"
          /tmp/sdistenv/bin/python -c "
          import proofsheet
          d = proofsheet.devices('apple')
          assert d, 'no presets -- the table did not make it into the sdist'
          print(f'  built from sdist and imported, {len(d)} apple presets')
          "

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-sdist
          path: dist
          if-no-files-found: error

  publish-crates:
    name: crates.io
    needs: [guard, build-node, build-python, build-sdist]
    if: needs.guard.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish proofsheet-core, then the CLI
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          # --allow-dirty is deliberately NOT used: a dirty tree at release
          # time means the tag does not describe what is being published.
          publish() {
            local crate="$1"
            # NOT --no-verify. That flag skips building the packaged crate,
            # which is exactly how a proofsheet-core that could not compile
            # (include_str! escaping the crate dir) reached crates.io.
            if cargo publish -p "$crate" 2>&1 | tee /tmp/out; then
              echo "published $crate"
            elif grep -q "already exists" /tmp/out; then
              echo "$crate already published at this version; continuing"
            else
              echo "publishing $crate failed"; exit 1
            fi
          }
          publish proofsheet-core
          # The registry index needs a moment before the CLI can resolve the
          # core it just published.
          for i in $(seq 1 30); do
            if cargo search proofsheet-core --limit 1 | grep -q "proofsheet-core"; then
              break
            fi
            sleep 10
          done
          publish proofsheet

  publish-npm:
    name: npm
    needs: [guard, publish-crates]
    if: needs.guard.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      # ONE package, every platform inside it -- the same way nedb-engine
      # ships. napi's default is optionalDependencies fanned out into a
      # package per triple, which is npm-idiomatic but puts five entries on
      # the registry listing for one product. The generated loader already
      # prefers a local ./proofsheet.<triple>.node over the published
      # sub-package, so bundling them is enough; no loader changes needed.
      #
      # This also deletes `napi prepublish` from the release path, which is
      # where both the E402 (scoped packages default to private) and the
      # ENEEDAUTH (.npmrc is not read from parent directories) failures came
      # from. Fewer moving parts, fewer ways to publish a broken package.
      - uses: actions/download-artifact@v4
        with:
          pattern: node-*
          path: crates/proofsheet-node
          merge-multiple: true

      - name: Every expected platform must be bundled
        working-directory: crates/proofsheet-node
        run: |
          ls -la *.node
          python3 - <<'PY'
          import glob, sys
          want = {
              "proofsheet.darwin-arm64.node",
              "proofsheet.darwin-x64.node",
              "proofsheet.linux-x64-gnu.node",
              "proofsheet.win32-x64-msvc.node",
          }
          have = set(glob.glob("*.node"))
          missing = sorted(want - have)
          for m in missing:
              print("  MISSING", m)
          print(f"  {len(want & have)}/{len(want)} platform addons bundled")
          sys.exit(1 if missing else 0)
          PY

      # Pack, install the tarball somewhere clean, and require() it. A
      # package that cannot be installed and loaded must not be published --
      # every registry check we had said 0.1.1 was fine while it threw
      # ERR_DLOPEN_FAILED on any Linux older than Ubuntu 24.04.
      - name: The packed tarball must install and load
        working-directory: crates/proofsheet-node
        run: |
          set -euo pipefail
          TARBALL=$(npm pack --silent)
          echo "packed $TARBALL"
          VERIFY=$(mktemp -d)
          cp "$TARBALL" "$VERIFY/"
          cd "$VERIFY"
          npm init -y >/dev/null
          npm install "./$TARBALL" --no-audit --no-fund
          node -e "
            const p = require('@interchained/proofsheet');
            const v = p.version();
            if (!v) { console.error('version() returned nothing'); process.exit(1); }
            const d = p.devices('apple');
            if (!d.length) { console.error('no presets'); process.exit(1); }
            console.log('  installed and loaded, version', v, '/', d.length, 'apple presets');
          "

      - name: Publish
        working-directory: crates/proofsheet-node
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

  publish-pypi:
    name: PyPI
    needs: [guard, publish-crates]
    if: needs.guard.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - run: ls -la dist
      - uses: PyO3/maturin-action@v1
        with:
          command: upload
          args: --non-interactive --skip-existing dist/*
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}

  github-release:
    name: GitHub release
    needs: [guard, publish-crates, publish-npm, publish-pypi]
    if: always() && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          find artifacts -type f | head -50
          gh release create "${GITHUB_REF_NAME}" \
            --title "proofsheet ${GITHUB_REF_NAME}" \
            --notes "Exact-pixel store screenshots, deterministic and local-first.

          - crates.io: \`cargo install proofsheet\`
          - npm: \`npm i @interchained/proofsheet\`
          - PyPI: \`pip install proofsheet\`

          https://github.com/interchained/proofsheet" \
            --verify-tag || echo "release already exists"
