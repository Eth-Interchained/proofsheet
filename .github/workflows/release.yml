name: Release

# One tag, three registries, version-aligned.
#
# Ordering matters and is deliberate:
#   guard -> builds -> crates.io -> npm + PyPI -> GitHub release
#
# crates.io goes first because proofsheet (the CLI) depends on
# proofsheet-core by version; the core must be resolvable from the registry
# before the CLI can be published. npm and PyPI have no such coupling and run
# in parallel afterwards.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build everything, publish nothing"
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Nothing is built until the tag and the manifests agree. A tag that says
  # v0.2.0 against manifests saying 0.1.0 publishes artifacts whose reported
  # version is a lie, and registries are immutable.
  guard:
    name: tag and manifests agree
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v5
      - run: python3 scripts/check_versions.py
      - id: v
        run: |
          set -euo pipefail
          MANIFEST=$(python3 -c "
          import json;print(json.load(open('crates/proofsheet-node/package.json'))['version'])")
          echo "manifest version: $MANIFEST"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME#v}"
            echo "tag version: $TAG"
            if [ "$TAG" != "$MANIFEST" ]; then
              echo "MISMATCH: tag v$TAG vs manifests $MANIFEST"
              echo "Bump with: python3 scripts/check_versions.py $TAG"
              exit 1
            fi
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=${{ github.event.inputs.dry_run == 'false' }}" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$MANIFEST" >> "$GITHUB_OUTPUT"

  build-node:
    name: node ${{ matrix.target }}
    needs: guard
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: Swatinem/rust-cache@v2
      - name: Build addon
        working-directory: crates/proofsheet-node
        run: |
          npm install --no-audit --no-fund
          npx napi build --platform --release --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: node-${{ matrix.target }}
          path: crates/proofsheet-node/*.node
          if-no-files-found: error

  build-python:
    name: wheel ${{ matrix.target }}
    needs: guard
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
          - os: macos-latest
            target: x86_64
          - os: macos-latest
            target: aarch64
          - os: windows-latest
            target: x64
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          # abi3 means one wheel per platform covers Python 3.8+, so the
          # matrix is platforms only, not platforms x interpreters.
          args: --release --out dist --manifest-path crates/proofsheet-py/Cargo.toml
          sccache: "true"
          manylinux: auto
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}
          path: dist
          if-no-files-found: error

  build-sdist:
    name: python sdist
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist --manifest-path crates/proofsheet-py/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-sdist
          path: dist
          if-no-files-found: error

  publish-crates:
    name: crates.io
    needs: [guard, build-node, build-python, build-sdist]
    if: needs.guard.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish proofsheet-core, then the CLI
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          # --allow-dirty is deliberately NOT used: a dirty tree at release
          # time means the tag does not describe what is being published.
          publish() {
            local crate="$1"
            if cargo publish -p "$crate" --no-verify 2>&1 | tee /tmp/out; then
              echo "published $crate"
            elif grep -q "already exists" /tmp/out; then
              echo "$crate already published at this version; continuing"
            else
              echo "publishing $crate failed"; exit 1
            fi
          }
          publish proofsheet-core
          # The registry index needs a moment before the CLI can resolve the
          # core it just published.
          for i in $(seq 1 30); do
            if cargo search proofsheet-core --limit 1 | grep -q "proofsheet-core"; then
              break
            fi
            sleep 10
          done
          publish proofsheet

  publish-npm:
    name: npm
    needs: [guard, publish-crates]
    if: needs.guard.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          pattern: node-*
          path: crates/proofsheet-node/artifacts
      - name: Assemble platform packages and publish
        working-directory: crates/proofsheet-node
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npx napi artifacts --dir artifacts
          ls -la npm/*/ || true
          npx napi prepublish -t npm --skip-gh-release
          npm publish --access public

  publish-pypi:
    name: PyPI
    needs: [guard, publish-crates]
    if: needs.guard.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - run: ls -la dist
      - uses: PyO3/maturin-action@v1
        with:
          command: upload
          args: --non-interactive --skip-existing dist/*
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}

  github-release:
    name: GitHub release
    needs: [guard, publish-crates, publish-npm, publish-pypi]
    if: always() && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          find artifacts -type f | head -50
          gh release create "${GITHUB_REF_NAME}" \
            --title "proofsheet ${GITHUB_REF_NAME}" \
            --notes "Exact-pixel store screenshots, deterministic and local-first.

          - crates.io: \`cargo install proofsheet\`
          - npm: \`npm i @interchained/proofsheet\`
          - PyPI: \`pip install proofsheet\`

          https://github.com/interchained/proofsheet" \
            --verify-tag || echo "release already exists"
