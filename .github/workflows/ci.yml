name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  versions:
    name: manifest versions agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 scripts/check_versions.py

  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features

  # The unit suite can prove the preset table is internally consistent, but
  # only a real browser can prove the captures come out the size the stores
  # demand. This job is the one that would catch a CDP behaviour change.
  live-capture:
    name: live capture against real Chromium
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Fetch pinned Chrome for Testing
        run: |
          set -euo pipefail
          V=$(curl -sS https://googlechromelabs.github.io/chrome-for-testing/last-known-good-versions.json \
              | python3 -c "import sys,json;print(json.load(sys.stdin)['channels']['Stable']['version'])")
          echo "chrome version: $V"
          curl -sSL -o chs.zip \
            "https://storage.googleapis.com/chrome-for-testing-public/$V/linux64/chrome-headless-shell-linux64.zip"
          python3 -c "import zipfile;zipfile.ZipFile('chs.zip').extractall('chrome')"
          BIN=$(find chrome -type f -name chrome-headless-shell | head -1)
          chmod +x "$BIN"
          echo "PROOFSHEET_CHROME=$PWD/$BIN" >> "$GITHUB_ENV"

      - run: cargo build --release --workspace

      - name: Capture every store preset and assert exact dimensions
        run: |
          set -euo pipefail
          cat > subject.html <<'HTML'
          <!doctype html><meta charset=utf-8><title>ci</title>
          <!-- A real mobile-ready page declares this. Without it Chrome uses
               the legacy 980px layout viewport, and viewport_honoured is
               correctly false. -->
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <style>body{margin:0;min-height:100vh;background:#0E3B37;color:#F7F5F2;
          font:16px system-ui;display:grid;place-items:center}</style>
          <div><p id=v></p><p id=t></p><p id=r></p></div>
          <script>
            v.textContent=innerWidth+'x'+innerHeight+'@'+devicePixelRatio;
            t.textContent=new Date().toISOString();
            r.textContent=Math.random();
          </script>
          HTML
          for store in apple play; do
            ./target/release/proofsheet capture \
              --url "file://$PWD/subject.html" --store "$store" \
              --out "out-$store" --json > "manifest-$store.json"
          done

      # A nonzero exit above already fails the build, but assert explicitly so
      # the log states the invariant rather than implying it.
      #
      # Note the floor check. Without it this step passes when the glob
      # matches nothing -- zero captures examined, zero failures found, exit
      # 0. A check that cannot fail is worse than no check, because it reads
      # as evidence. The floor is what makes the green mean something.
      - name: Assert captures happened and none is off-size
        run: |
          python3 - <<'PY'
          import json, glob, sys

          # 33 Apple + 11 Play as of 2026-08-22. Removing a store preset
          # should require deliberately lowering this number.
          MIN_EXPECTED = 44

          manifests = sorted(glob.glob('manifest-*.json'))
          if not manifests:
              print('FAIL: no manifests were produced at all')
              sys.exit(1)

          bad, total = [], 0
          for f in manifests:
              report = json.load(open(f))
              for r in report['results']:
                  total += 1
                  if r['outcome'] != 'exact':
                      cap = r.get('capture') or {}
                      bad.append((
                          r['device_id'],
                          r['outcome'],
                          cap.get('expected'),
                          cap.get('actual'),
                          r.get('error'),
                      ))
              # The library computes its own verdict; if it and this script
              # disagree, one of them is wrong and that must be loud.
              if not report['ok']:
                  print(f'  {f}: report.ok is false')

          print(f'{len(manifests)} manifests, {total} captures checked')
          for d, outcome, want, got, err in bad:
              print(f'  {outcome.upper()} {d}: wanted {want}, got {got} {err or ""}')

          if total < MIN_EXPECTED:
              print(f'FAIL: only {total} captures, expected >= {MIN_EXPECTED}. '
                    'A shrinking run silently stops testing things.')
              sys.exit(1)
          sys.exit(1 if bad else 0)
          PY

      # Dimensions cannot detect "right pixels, wrong layout": a page served
      # to a desktop UA can override the layout viewport via meta-viewport, so
      # every size assertion passes on a desktop screenshot in a phone frame.
      # This asserts on what the PAGE saw, which is the only thing that can.
      - name: Device emulation — the page must see the viewport we asked for
        run: |
          set -euo pipefail
          ./target/release/proofsheet capture --url "file://$PWD/subject.html" \
            --device apple-iphone-6-9-1320 --device apple-ipad-13-2064 \
            --device play-phone-portrait --device apple-mac-1440 \
            --out env-out --quiet --json > env.json
          python3 - <<'PY'
          import json, sys
          rep = json.load(open('env.json'))
          rows = rep['results']
          if not rows:
              print('FAIL: no results, so this proves nothing'); sys.exit(1)
          # id -> minimum touch points expected
          TOUCH = {
              'apple-iphone-6-9-1320': 1,
              'apple-ipad-13-2064': 1,
              'play-phone-portrait': 1,
              'apple-mac-1440': 0,
          }
          bad = []
          for r in rows:
              cap = r.get('capture') or {}
              env = cap.get('environment')
              if not env:
                  bad.append(f"{r['device_id']}: no environment recorded")
                  continue
              print(f"  {r['device_id']:<26} vp={env['inner_width']}x{env['inner_height']}"
                    f" touch={env['touch_points']} honoured={env['viewport_honoured']}")
              if not env['viewport_honoured']:
                  bad.append(
                      f"{r['device_id']}: page overrode the viewport "
                      f"(saw {env['inner_width']}x{env['inner_height']}) -- "
                      "device emulation is not taking effect")
              want = TOUCH.get(r['device_id'])
              if want is not None:
                  if want > 0 and env['touch_points'] < want:
                      bad.append(f"{r['device_id']}: touch_points "
                                 f"{env['touch_points']}, expected >= {want}")
                  if want == 0 and env['touch_points'] != 0:
                      bad.append(f"{r['device_id']}: desktop preset reports touch")
          for b in bad:
              print('  FAIL', b)
          sys.exit(1 if bad else 0)
          PY

      - name: Determinism — same seed twice must be byte-identical
        run: |
          set -euo pipefail
          D="--device apple-iphone-6-9-1320 --device play-phone-portrait"
          ./target/release/proofsheet capture --url "file://$PWD/subject.html" \
            $D --seed 42 --out det-a --json > det-a.json
          ./target/release/proofsheet capture --url "file://$PWD/subject.html" \
            $D --seed 42 --out det-b --json > det-b.json
          ./target/release/proofsheet capture --url "file://$PWD/subject.html" \
            --device apple-iphone-6-9-1320 --seed 999 --out det-c --json > det-c.json
          python3 - <<'PY'
          import json, sys

          def digests(path):
              d = {}
              for r in json.load(open(path))['results']:
                  cap = r.get('capture')
                  if cap:
                      d[r['device_id']] = cap['sha256']
              return d

          a, b, c = digests('det-a.json'), digests('det-b.json'), digests('det-c.json')
          if not a:
              print('FAIL: det-a produced no captures, so this proves nothing')
              sys.exit(1)
          ok = True
          for k in a:
              same = a[k] == b[k]
              print(f'{k}: same-seed identical = {same}')
              ok &= same
          # Negative control: a different seed MUST change the bytes, or the
          # determinism layer is inert and the test above proves nothing.
          k = 'apple-iphone-6-9-1320'
          differs = a[k] != c[k]
          print(f'{k}: different-seed differs = {differs}')
          ok &= differs
          sys.exit(0 if ok else 1)
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captures
          path: |
            out-*/**
            manifest-*.json
          retention-days: 7

  # Three surfaces wrap one core, which is only true if it is checked.
  # A binding that quietly builds different options produces plausible
  # images at the wrong metrics, and nothing about the output looks wrong.
  bindings:
    name: node + python bindings, and cross-surface parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch pinned Chrome for Testing
        run: |
          set -euo pipefail
          V=$(curl -sS https://googlechromelabs.github.io/chrome-for-testing/last-known-good-versions.json \
              | python3 -c "import sys,json;print(json.load(sys.stdin)['channels']['Stable']['version'])")
          curl -sSL -o chs.zip \
            "https://storage.googleapis.com/chrome-for-testing-public/$V/linux64/chrome-headless-shell-linux64.zip"
          python3 -c "import zipfile;zipfile.ZipFile('chs.zip').extractall('chrome')"
          BIN=$(find chrome -type f -name chrome-headless-shell | head -1)
          chmod +x "$BIN"
          echo "PROOFSHEET_CHROME=$PWD/$BIN" >> "$GITHUB_ENV"

      - name: Build CLI
        run: cargo build --release -p proofsheet

      - name: Build and test the Node binding
        working-directory: crates/proofsheet-node
        run: |
          npm install --no-audit --no-fund
          npx napi build --platform --release
          node test/smoke.mjs

      # The first version of the binding emitted a .d.ts referencing a
      # ProofsheetReport type that was never declared: fine at runtime,
      # broken for every TypeScript consumer. This is the guard.
      #
      # `-p typescript` is required -- `npx typescript tsc` cannot resolve the
      # binary, because the package name and the command name differ.
      - name: The generated .d.ts must have no dangling types
        working-directory: crates/proofsheet-node
        run: |
          npx --yes -p typescript@5 tsc --noEmit --strict \
            --skipLibCheck false index.d.ts

      - name: Build and test the Python binding
        run: |
          set -euo pipefail
          pip install --upgrade pip maturin
          cd crates/proofsheet-py
          maturin build --release --out dist
          pip install dist/*.whl
          cd "$GITHUB_WORKSPACE"
          python crates/proofsheet-py/tests/smoke.py

      - name: Cross-surface parity — identical bytes from CLI, Node and Python
        run: |
          set -euo pipefail
          cat > subject.html <<'HTML'
          <!doctype html><meta charset=utf-8>
          <style>body{margin:0;min-height:100vh;background:#0E3B37;color:#F7F5F2;
          font:16px system-ui;display:grid;place-items:center}</style>
          <div><p id=v></p><p id=t></p><p id=r></p></div>
          <script>
            v.textContent=innerWidth+'x'+innerHeight+'@'+devicePixelRatio;
            t.textContent=new Date().toISOString();
            r.textContent=Math.random();
          </script>
          HTML
          python3 scripts/parity.py \
            ./target/release/proofsheet \
            ./crates/proofsheet-node \
            "file://$PWD/subject.html"

  examples:
    name: examples still build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: Swatinem/rust-cache@v2

      # The examples are documentation that executes, so they rot exactly
      # like documentation -- silently, and only for new users.
      #
      # They build against THIS TREE, not the published packages. The first
      # version of this job installed from the registries and asserted the
      # API was present, which cannot pass on the commit that introduces a
      # new API: the registry only has it after Release publishes, and
      # Release runs after CI. A check that can only pass once the thing it
      # gates has already shipped is not a gate. Verifying published
      # artifacts is the release workflow's job, and it does it there.
      - name: Rust example compiles against this tree
        working-directory: examples/rust
        run: |
          set -euo pipefail
          cat >> Cargo.toml <<'PATCH'

          [patch.crates-io]
          proofsheet-core = { path = "../../crates/proofsheet-core" }
          PATCH
          cargo build --release

      - name: Node example runs against this tree
        run: |
          set -euo pipefail
          cd crates/proofsheet-node
          npm install --no-audit --no-fund
          npx napi build --platform --release
          cd ../../examples/node
          npm install ../../crates/proofsheet-node --no-audit --no-fund
          node --check shots.js
          node -e "
            const p = require('@interchained/proofsheet');
            for (const fn of ['capture', 'devices', 'version', 'findBrowser']) {
              if (typeof p[fn] !== 'function') throw new Error(fn + ' missing');
            }
            console.log('  node API present, proofsheet', p.version());
          "

      - name: Python example runs against this tree
        run: |
          set -euo pipefail
          pip install maturin
          maturin build --release --out /tmp/wheel \
            --manifest-path crates/proofsheet-py/Cargo.toml
          pip install /tmp/wheel/*.whl
          cd examples/python
          python -m py_compile shots.py
          python -c "
          import proofsheet
          for name in ('capture', 'devices', 'find_browser', 'Environment'):
              assert hasattr(proofsheet, name), f'{name} missing'
          import dataclasses
          fields = {f.name for f in dataclasses.fields(proofsheet.Capture)}
          assert 'environment' in fields, 'Capture dropped environment again'
          print('  python API present, proofsheet', proofsheet.__version__)
          "
