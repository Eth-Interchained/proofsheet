[workspace]
resolver = "2"
members = ["crates/proofsheet-core", "crates/proofsheet-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "BUSL-1.1"
repository = "https://github.com/Eth-Interchained/proofsheet"
homepage = "https://github.com/Eth-Interchained/proofsheet"
authors = ["Interchained LLC <founders@vibecode-101.com>"]

[workspace.dependencies]
proofsheet-core = { path = "crates/proofsheet-core", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha1 = "0.10"
sha2 = "0.10"
getrandom = "0.2"
thiserror = "2"
