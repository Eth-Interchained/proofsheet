[workspace]
resolver = "2"
members = [
    "crates/proofsheet-core",
    "crates/proofsheet-cli",
    "crates/proofsheet-node",
    "crates/proofsheet-py",
]

[workspace.package]
version = "0.1.2"
edition = "2021"
rust-version = "1.82"
license = "BUSL-1.1"
repository = "https://github.com/interchained/proofsheet"
homepage = "https://interchained.org"
authors = ["Interchained LLC Labs <dev@interchained.org>"]

[workspace.dependencies]
proofsheet-core = { path = "crates/proofsheet-core", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha1 = "0.10"
sha2 = "0.10"
getrandom = "0.2"
thiserror = "2"
